name: Compilar APK Android (ElectroCenso Pro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK Debug Listo para Instalar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Inicializar proyecto nativo Android y configurar permisos
        run: |
          npx cap add android
          npx cap sync android
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />"""
          if "WRITE_EXTERNAL_STORAGE" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: ElectroCenso-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
